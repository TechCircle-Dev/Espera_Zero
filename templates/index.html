<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Arvo&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <title>Totem</title>
</head>

<body>
    <div class="container">
        <h1 class="texto1">
            Tempo Total <span class="de">de</span> Espera:
        </h1>
        <span id="total">00:00</span>
        <div class="acessibilidade"></div>

        <div id="modalAcessibilidade" class="modal">
            <div class="modal-conteudo">
                <span class="fechar">&times;</span>
                <h2>Acessibilidades</h2>

                <p class="filtros">Controle de Fonte</p>
                <div class="grid2">
                    <button onclick="aumentarFonte()">Tamanho de Fonte</button>
                </div>


                <p class="filtros">Navegação do Site</p>
                <div class="grid2">
                    <button>Leitor de sites</button>
                    <button>Guia de leitura</button>
                </div>

                <p class="filtros">Controle de Cores</p>
                <div class="grid2">
                    <button>Modo daltônico</button>
                </div>

                <button id="btnRestaurar" onclick="restaurarFonte()">
                    Restaurar
                </button>

            </div>
        </div>


        <img class="relogio" src="{{ url_for('static', filename='img/relogio.png') }}" alt="relogio">
        <img class="mancha_amarela" src="{{ url_for('static', filename='img/mancha1.png') }}" alt="Mancha Amarela">
        <img class="mancha_azul" src="{{ url_for('static', filename='img/mancha2.png') }}" alt="Mancha Azul">

        <a href="{{ url_for('opcoes') }}" class="botao">
            Ver por Caixas <i class="bi bi-chevron-right"></i>
        </a>

    </div>

 <script>
    const btn = document.querySelector(".acessibilidade");
    const modal = document.getElementById("modalAcessibilidade");
    const fechar = document.querySelector(".fechar");
    const btnRestaurar = document.getElementById("btnRestaurar");

    btn.addEventListener("click", () => {
        modal.style.display = "block";
    });

    fechar.addEventListener("click", () => {
        modal.style.display = "none";
    });

    window.addEventListener("click", (e) => {
        if (e.target === modal) {
            modal.style.display = "none";
        }
    });

    let nivelFonte = 1; // começa no nível 1 (padrão)
    let tamanhosOriginais = new Map(); // para guardar tamanhos iniciais

    function aumentarFonte() {
        if (nivelFonte >= 3) return; // se já está no nível máximo, não faz nada

        const elementos = document.querySelectorAll("body *:not(#modalAcessibilidade *)");

        elementos.forEach(el => {
            const estilo = window.getComputedStyle(el);
            const tamanho = parseFloat(estilo.fontSize);

            // salva tamanho original uma única vez
            if (!tamanhosOriginais.has(el)) {
                tamanhosOriginais.set(el, tamanho);
            }

            el.style.fontSize = (tamanho * 1.1) + "px"; // aumenta 10%
        });

        nivelFonte++; // avança o nível

        // exibe o botão de restaurar se ainda não estiver visível
        btnRestaurar.style.display = "inline-block";
    }

    function restaurarFonte() {
        const elementos = document.querySelectorAll("body *:not(#modalAcessibilidade *)");

        elementos.forEach(el => {
            if (tamanhosOriginais.has(el)) {
                el.style.fontSize = tamanhosOriginais.get(el) + "px"; // volta ao original
            } else {
                el.style.fontSize = ""; // limpa estilos adicionados
            }
        });

        // reseta estado
        nivelFonte = 1;
        btnRestaurar.style.display = "none"; // esconde o botão novamente
    }

    async function atualizarContagem() {
        try {
            const resp = await fetch("/count");
            const texto = await resp.text();

            const match = texto.match(/Tempo total: (\d+) minutos/);
            if (match) {
                let minutos = parseInt(match[1]);

                if (minutos === 0) {
                    document.getElementById("total").textContent = "00:00";
                } else {
                    let horas = Math.floor(minutos / 60);
                    let restoMinutos = minutos % 60;
                    let minutosFormatados = restoMinutos.toString().padStart(2, '0');
                    document.getElementById("total").textContent = `${horas}:${minutosFormatados}`;
                }
            }
        } catch (err) {
            console.error("Erro ao atualizar:", err);
        }
    }

    setInterval(atualizarContagem, 2000);
    atualizarContagem();
</script>


</body>

</html>
